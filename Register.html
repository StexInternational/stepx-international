<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StepX Webinar Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f6f9;
      color: #333;
    }

    .hero {
      background: linear-gradient(to right, #0d6efd, #6610f2);
      padding: 70px 20px;
      color: white;
      text-align: center;
      border-radius: 0 0 30px 30px;
    }

    .hero h1 {
      font-weight: 700;
      font-size: 2.5rem;
    }

    .registration-box {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .form-label {
      font-weight: 600;
    }

    .submit-btn {
      background-color: #ffc107;
      border: none;
      font-weight: 600;
    }

    .submit-btn:hover {
      background-color: #e0a800;
    }

    .webinar-card {
      border: none;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease;
    }

    .webinar-card:hover {
      transform: scale(1.03);
    }

    .webinar-card img {
      height: 180px;
      object-fit: cover;
      width: 100%;
    }

    .webinar-title {
      font-weight: 600;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 1.75rem;
      }

      .registration-box {
        padding: 25px;
      }

      .webinar-card img {
        height: 150px;
      }
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Register for Our Upcoming Webinar</h1>
    <p class="mt-2 mb-0">Boost your business with proven strategies — book your free seat today.</p>
  </section>

  <!-- Main Section -->
  <section class="container py-5">
    <div class="row g-5">

      <!-- Registration Form -->
      <div class="col-lg-6">
        <div class="registration-box">
          <h4 class="mb-4 fw-bold text-primary">Secure Your Spot</h4>
          <form id="webinarForm" action="https://formspree.io/f/xpwlrozq" method="POST" onsubmit="return handleSubmit(event)">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" name="Name" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Email ID</label>
              <input type="email" name="Email" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Contact Number</label>
              <input type="tel" name="Contact Number" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Company Name</label>
              <input type="text" name="Company Name" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Company Details</label>
              <textarea name="Company Details" rows="3" class="form-control"></textarea>
            </div>
            <button type="submit" class="btn submit-btn w-100 py-2 rounded-pill">Submit & Get Meeting Link</button>
          </form>

          <!-- Meeting Link Message -->
          <div id="meeting-link-msg" class="alert alert-success mt-4" style="display:none;"></div>
        </div>
      </div>

      <!-- Upcoming Webinars -->
      <div class="col-lg-6">
        <h4 class="mb-4 fw-bold">Upcoming Webinars</h4>
        <div class="row g-4">
          <div class="col-12 col-md-6">
            <div class="card webinar-card">
              <img src="img/webinar1.jpg" alt="Webinar 1" />
              <div class="card-body text-center">
                <p class="webinar-title">Team Performance Secrets</p>
                <p class="text-muted small">Aug 10 · 4 PM</p>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="card webinar-card">
              <img src="img/webinar2.jpg" alt="Webinar 2" />
              <div class="card-body text-center">
                <p class="webinar-title">Hiring Right, Training Smart</p>
                <p class="text-muted small">Aug 15 · 11 AM</p>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="card webinar-card">
              <img src="img/webinar3.jpg" alt="Webinar 3" />
              <div class="card-body text-center">
                <p class="webinar-title">Daily Sales Discipline</p>
                <p class="text-muted small">Aug 20 · 5 PM</p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- JS to handle redirect and show meeting link -->
  <script>
    function handleSubmit(event) {
      event.preventDefault();
      const form = event.target;
      const meetingLinkMsg = document.getElementById('meeting-link-msg');
      meetingLinkMsg.style.display = 'none';  // hide previous message

      fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { Accept: "application/json" },
      })
        .then(response => {
          if (response.ok) {
            // Show meeting link message instead of redirect
            meetingLinkMsg.style.display = 'block';
            meetingLinkMsg.innerHTML = '🎉 Registration successful! Join the webinar here: <a href="https://meet.google.com/pvw-xqwd-cef" target="_blank" rel="noopener noreferrer">Click to Join</a>';
            form.reset();
          } else {
            alert("There was an issue with submission. Please try again.");
          }
        })
        .catch(() => {
          alert("Server error. Try again later.");
        });

      return false;
    }
  </script>

</body>
</html>
